<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品カタログサンプル｜木と真鍮の工房 fushi</title>
<meta name="description" content="無垢材の家具と真鍮・革の装身具を扱う架空の工房「fushi」の商品カタログサンプルです。カテゴリーと素材で絞り込みができ、家具のサイズ感が伝わる見せ方を実装したポートフォリオ用デモです。">
<style>
  :root{
    --bg:#f7f3ec;
    --card:#ffffff;
    --border:#e6ddc9;
    --text:#2b2621;
    --text-sub:#7d7266;
    --accent:#b3652f;
    --accent-dark:#8f4f22;
    --accent-soft:#f1e2c9;
    --ok:#4f7a52;
    --ok-bg:#e9f1e7;
    --warn:#a97a1f;
    --warn-bg:#faf1da;
    --info:#3f6b8a;
    --info-bg:#e8f1f6;
    --sold:#8a8a8a;
    --sold-bg:#ececec;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  h1,h2,h3{margin:0;}
  button{font-family:inherit;}

  .hero{background:linear-gradient(160deg,#eee0c6,#f7f3ec 70%);padding:54px 16px 38px;text-align:center;border-bottom:1px solid var(--border);}
  .hero-inner{max-width:720px;margin:0 auto;}
  .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent-dark);font-weight:700;margin:0 0 12px;}
  .hero h1{font-family:"游明朝","Hiragino Mincho ProN","Yu Mincho",serif;font-size:30px;line-height:1.4;margin:0 0 16px;}
  .tagline{font-size:14px;color:var(--text-sub);line-height:1.9;margin:0 0 20px;}
  .badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .badge{font-size:11.5px;background:#fff;border:1px solid var(--border);padding:6px 13px;border-radius:20px;color:var(--text);}

  .container{max-width:1100px;margin:0 auto;padding:26px 16px 60px;}

  .filter-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px 14px;margin-bottom:8px;}
  .group-tabs{display:flex;gap:8px;margin-bottom:12px;}
  .chip{border:1px solid var(--border);background:#fff;color:var(--text-sub);border-radius:20px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer;}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .sub-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .sub-chips .chip{padding:5px 12px;font-size:12.5px;font-weight:600;}
  .filter-row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;border-top:1px dashed var(--border);padding-top:12px;}
  .field-inline{display:flex;flex-direction:column;gap:4px;}
  .field-inline label{font-size:11px;color:var(--text-sub);}
  .field-inline select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;color:var(--text);min-width:170px;}
  .result-count{font-size:12px;color:var(--text-sub);margin:14px 2px 16px;}

  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px;}
  .product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(43,38,33,.05);}
  .photo{position:relative;aspect-ratio:4/3;background-size:cover;background-position:center;}
  .photo.has-photo{filter:sepia(.22) saturate(1.12) brightness(1.02) contrast(1.03);}
  .photo.has-photo .icon-wrap{display:none;}
  .photo::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.08) 0 3px,rgba(0,0,0,.03) 3px 6px);mix-blend-mode:overlay;pointer-events:none;}
  .photo.has-photo{cursor:zoom-in;}
  .zoom-hint{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:rgba(43,38,33,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2;pointer-events:none;}
  .icon-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .lightbox{position:fixed;inset:0;background:rgba(20,17,14,.86);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:min(92vw,720px);max-height:86vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.4);filter:sepia(.22) saturate(1.12) brightness(1.02) contrast(1.03);}
  .lightbox-close{position:absolute;top:18px;right:20px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:22px;line-height:1;cursor:pointer;}
  .lightbox-close:active{background:rgba(255,255,255,.28);}
  .stock-badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;z-index:2;}
  .st-ok{background:var(--ok-bg);color:var(--ok);}
  .st-warn{background:var(--warn-bg);color:var(--warn);}
  .st-info{background:var(--info-bg);color:var(--info);}
  .st-sold{background:var(--sold-bg);color:var(--sold);}

  .card-body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1;}
  .cat-tag{font-size:11px;color:var(--accent-dark);font-weight:700;letter-spacing:.03em;}
  .p-name{margin:3px 0 0;font-size:16.5px;font-family:"游明朝","Hiragino Mincho ProN","Yu Mincho",serif;}
  .p-price{font-size:18px;font-weight:700;margin:4px 0 6px;}
  .p-desc{font-size:12.5px;color:var(--text-sub);line-height:1.65;min-height:2.6em;}

  .spec-block{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .sizebar-track{position:relative;height:8px;border-radius:4px;background:#efe6d3;overflow:hidden;}
  .sizebar-track.scale-furniture{background-image:repeating-linear-gradient(to right,var(--border) 0 1px,transparent 1px 25%);}
  .sizebar-track.scale-accessory{background-image:repeating-linear-gradient(to right,var(--border) 0 1px,transparent 1px 20%);}
  .sizebar-fill{position:absolute;top:0;left:0;height:100%;background:var(--accent);border-radius:4px;}
  .scale-labels{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-sub);margin-top:3px;}
  .sizebar-label{font-size:12.5px;font-weight:700;margin-top:7px;}
  .sizebar-note{font-weight:400;color:var(--text-sub);font-size:11.5px;}
  .dims{font-size:11.5px;color:var(--text-sub);margin-top:2px;}

  .mat-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .mat-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-sub);background:#faf6ec;border:1px solid var(--border);padding:3px 9px 3px 4px;border-radius:20px;}
  .mat-swatch{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.08);flex-shrink:0;}

  .btn-inquiry{margin-top:12px;background:var(--accent-soft);color:var(--accent-dark);border:none;border-radius:7px;padding:9px 10px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .btn-inquiry:hover{background:#e7d2ab;}
  .btn-browse{margin-top:12px;background:#fff;border:1px solid var(--border);color:var(--text-sub);border-radius:7px;padding:9px 10px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .btn-browse:hover{border-color:var(--accent);color:var(--accent-dark);}
  .p-delivery{font-size:11px;color:var(--accent-dark);background:var(--accent-soft);border-radius:7px;padding:5px 8px;margin-top:8px;}
  .p-voice{font-size:11.5px;color:var(--text);border-top:1px dashed var(--border);margin-top:8px;padding-top:8px;}
  .p-voice b{color:var(--accent-dark);}

  .empty{grid-column:1/-1;text-align:center;color:var(--text-sub);font-size:13px;padding:40px 0;}

  .site-footer{text-align:center;font-size:12px;color:var(--text-sub);padding:36px 16px 56px;line-height:1.9;}
  .site-footer a{color:var(--accent-dark);}

  /* 素材スウォッチ(CSSグラデーションで質感を表現) */
  .mat-oak{background:linear-gradient(135deg,#e6c795,#c99a5c 45%,#a97c40 75%,#8f6533);}
  .mat-walnut{background:linear-gradient(135deg,#7d5236,#5a3821 50%,#3f2513);}
  .mat-ash{background:linear-gradient(135deg,#efe3c6,#dccba0 55%,#c7b384);}
  .mat-brass{background:linear-gradient(120deg,#f6de9d,#caa04a 40%,#8f6c28 70%,#eecf86);}
  .mat-silver{background:linear-gradient(120deg,#f4f4f4,#cfd3d6 50%,#9ea4a8);}
  .mat-leather{background:linear-gradient(135deg,#8a5738,#6a4027 55%,#452715);}
  .mat-steel{background:linear-gradient(135deg,#cdd2d6,#9da4aa 55%,#6d747a);}
  .mat-fabric{background:linear-gradient(135deg,#efe9da,#ddd5bf 60%,#c9bfa2);}
  .mat-glass{background:linear-gradient(135deg,#f4f8fa,#cfe1ea 55%,#a9c4d4);}

  /* 商品写真プレースホルダー(アイコンもCSSのみで表現) */
  .icon{position:relative;width:96px;height:96px;}
  .icon span{position:absolute;background:rgba(35,26,18,.34);border-radius:3px;box-shadow:0 1px 0 rgba(255,255,255,.25) inset;}
  .icon-chair .back{left:14px;top:8px;width:12px;height:50px;border-radius:5px;}
  .icon-chair .seat{left:14px;top:50px;width:62px;height:11px;border-radius:4px;}
  .icon-chair .legf{left:60px;top:59px;width:9px;height:31px;}
  .icon-chair .legb{left:18px;top:59px;width:9px;height:31px;}
  .icon-table .top{left:8px;top:18px;width:80px;height:10px;border-radius:3px;}
  .icon-table .legl{left:14px;top:26px;width:9px;height:52px;}
  .icon-table .legr{left:73px;top:26px;width:9px;height:52px;}
  .icon-shelf .side-l{left:10px;top:6px;width:9px;height:84px;}
  .icon-shelf .side-r{left:77px;top:6px;width:9px;height:84px;}
  .icon-shelf .board1{left:10px;top:6px;width:76px;height:8px;}
  .icon-shelf .board2{left:10px;top:44px;width:76px;height:8px;}
  .icon-shelf .board3{left:10px;top:82px;width:76px;height:8px;}
  .icon-stool .seat{left:16px;top:22px;width:64px;height:12px;border-radius:6px;}
  .icon-stool .legl{left:22px;top:32px;width:8px;height:48px;}
  .icon-stool .legr{left:66px;top:32px;width:8px;height:48px;}
  .icon-necklace .chain{left:14px;top:10px;width:68px;height:50px;background:transparent;border:5px solid rgba(35,26,18,.34);border-top:none;border-radius:0 0 60px 60px;box-shadow:none;}
  .icon-necklace .pendant{left:41px;top:54px;width:16px;height:16px;border-radius:50%;}
  .icon-earring .hookl{left:30px;top:16px;width:10px;height:10px;border-radius:50%;background:transparent;border:3px solid rgba(35,26,18,.34);box-shadow:none;}
  .icon-earring .dropl{left:27px;top:31px;width:16px;height:20px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;}
  .icon-earring .hookr{left:58px;top:16px;width:10px;height:10px;border-radius:50%;background:transparent;border:3px solid rgba(35,26,18,.34);box-shadow:none;}
  .icon-earring .dropr{left:55px;top:31px;width:16px;height:20px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;}
  .icon-bracelet .ring{left:16px;top:16px;width:64px;height:64px;border-radius:50%;background:transparent;border:9px solid rgba(35,26,18,.34);box-shadow:none;}
  .icon-keychain .ring{left:38px;top:8px;width:26px;height:26px;border-radius:50%;background:transparent;border:5px solid rgba(35,26,18,.34);box-shadow:none;}
  .icon-keychain .link{left:49px;top:32px;width:4px;height:14px;}
  .icon-keychain .charm{left:32px;top:44px;width:32px;height:38px;border-radius:6px;}

  @media (max-width:640px){
    .hero{padding:42px 16px 30px;}
    .hero h1{font-size:24px;}
    .filter-row{flex-direction:column;align-items:stretch;}
    .field-inline select{min-width:0;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <p class="eyebrow">FURNITURE &amp; ACCESSORY ATELIER</p>
    <h1>木と真鍮の工房 fushi</h1>
    <p class="tagline">無垢材でつくる家具と、真鍮・革でつくる小さな装身具の工房です。<br>
      写真に加えて、サイズ感・素材感まで一目で伝わるカタログを目指しました。</p>
    <div class="badges">
      <span class="badge">一点ずつ受注制作</span>
      <span class="badge">無垢材・天然素材にこだわる</span>
      <span class="badge">工房直送</span>
    </div>
  </div>
</header>

<main class="container">
  <div class="filter-bar">
    <div class="group-tabs">
      <button class="chip active" data-group="all">すべて</button>
      <button class="chip" data-group="furniture">家具</button>
      <button class="chip" data-group="accessory">アクセサリー</button>
    </div>
    <div class="sub-chips" id="sub-chips"></div>
    <div class="filter-row">
      <div class="field-inline">
        <label for="material-filter">素材で絞り込む</label>
        <select id="material-filter"></select>
      </div>
      <div class="field-inline">
        <label for="sort-select">並び替え</label>
        <select id="sort-select">
          <option value="recommend">おすすめ順</option>
          <option value="price_asc">価格が安い順</option>
          <option value="price_desc">価格が高い順</option>
          <option value="name">名前(あいうえお順)</option>
        </select>
      </div>
    </div>
  </div>
  <div class="result-count" id="result-count"></div>

  <div class="product-grid" id="product-grid"></div>
</main>

<footer class="site-footer">
  <p>※このページは架空の店舗「木と真鍮の工房 fushi」を題材にした、商品カタログ更新・運用代行サービスのポートフォリオ用サンプルです。実在の店舗・商品とは関係ありません。写真をタップすると拡大表示できます。</p>
  <p class="tool-link">商品の追加・編集・削除は<a href="https://claude.ai/code/artifact/e15e79f8-2973-44b9-a07d-f932cf406eca" target="_blank" rel="noopener">更新ツール(店主さま向けデモ)</a>から行えます。</p>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="閉じる">×</button>
  <img id="lightbox-img" src="" alt="">
</div>

  // 更新ツール側で保存されたデータがあればそれを、なければ既定データ(seedProducts)を使う。
  // 保存データの形式が壊れている場合も、ここでcatchして既定データにフォールバックする。
  function loadProducts(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var data = JSON.parse(raw);
        if(data && Array.isArray(data.products) && data.products.length){
          return data.products;
        }
      }
    }catch(e){}
    return JSON.parse(JSON.stringify(seedProducts));
  }

  // お客様向けカタログでは、更新ツールで「下書き」にされた商品(published:false)は表示しない。
  var products = loadProducts().filter(function(p){ return p.published !== false; });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function yen(n){
    return "¥" + Math.round(n).toLocaleString("ja-JP");
  }

  function sizeBarHTML(p){
    var cat = CATEGORIES[p.category];
    if(cat.group === "furniture"){
      var pct = Math.max(2, Math.min(100, Math.round(p.size.w / 200 * 100)));
      return ""
        + '<div class="sizebar">'
        +   '<div class="sizebar-track scale-furniture"><div class="sizebar-fill" style="width:' + pct + '%"></div></div>'
        +   '<div class="scale-labels"><span>0</span><span>50</span><span>100</span><span>150</span><span>200cm</span></div>'
        +   '<div class="sizebar-label">幅 ' + p.size.w + 'cm</div>'
        +   '<div class="dims">奥行 ' + p.size.d + 'cm ・ 高さ ' + p.size.h + 'cm</div>'
        + '</div>';
    }
    var pct2 = Math.max(2, Math.min(100, Math.round(p.size.len / 50 * 100)));
    return ""
      + '<div class="sizebar">'
      +   '<div class="sizebar-track scale-accessory"><div class="sizebar-fill" style="width:' + pct2 + '%"></div></div>'
      +   '<div class="scale-labels"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50cm</span></div>'
      +   '<div class="sizebar-label">全長 ' + p.size.len + 'cm' + (p.note ? ' <span class="sizebar-note">' + escapeHtml(p.note) + '</span>' : '') + '</div>'
      + '</div>';
  }

  function renderCard(p){
    var cat = CATEGORIES[p.category];
    var stock = STOCK[p.stock];
    var stockLabel = stock.label + (p.stock === "made_to_order" && p.leadTime ? "(" + p.leadTime + ")" : "");
    var materialsHTML = p.materials.map(function(mk){
      var m = MATERIALS[mk];
      return '<span class="mat-chip"><span class="mat-swatch ' + m.cls + '"></span>' + escapeHtml(m.label) + '</span>';
    }).join("");
    var photoUrl = PHOTOS[p.id];
    var photoClass = photoUrl ? "photo has-photo" : "photo " + MATERIALS[p.materials[0]].cls;
    var photoStyle = photoUrl ? ' style="background-image:url(' + "'" + photoUrl + "'" + ')"' : '';

    return ""
      + '<article class="product-card">'
      +   '<div class="' + photoClass + '"' + photoStyle + (photoUrl ? ' data-id="' + p.id + '"' : '') + '>'
      +     '<span class="stock-badge ' + stock.cls + '">' + escapeHtml(stockLabel) + '</span>'
      +     '<div class="icon-wrap">' + ICON_HTML[cat.shape] + '</div>'
      +     (photoUrl ? '<span class="zoom-hint">🔍</span>' : '')
      +   '</div>'
      +   '<div class="card-body">'
      +     '<div class="cat-tag">' + escapeHtml(cat.label) + '</div>'
      +     '<h3 class="p-name">' + escapeHtml(p.name) + '</h3>'
      +     '<div class="p-price">' + yen(p.price) + '</div>'
      +     '<div class="p-desc">' + escapeHtml(p.desc || "") + '</div>'
      +     '<div class="spec-block">' + sizeBarHTML(p) + '</div>'
      +     '<div class="mat-row">' + materialsHTML + '</div>'
      +     (p.delivery ? '<div class="p-delivery">🚚 ' + escapeHtml(p.delivery) + '</div>' : '')
      +     (p.voiceComment ? '<div class="p-voice">💬 <b>' + escapeHtml(p.voiceName || "ご購入者") + '</b>「' + escapeHtml(p.voiceComment) + '」</div>' : '')
      +     (p.stock === "sold_out"
            ? '<button class="btn-browse" data-cat="' + p.category + '">同じカテゴリーの商品を見る</button>'
            : '<button class="btn-inquiry" data-id="' + p.id + '">この商品について問い合わせる</button>')
      +   '</div>'
      + '</article>';
  }

  var state = { group:"all", category:"all", material:"all", sort:"recommend" };

  var groupTabs = document.querySelectorAll(".group-tabs .chip");
  var subChipsEl = document.getElementById("sub-chips");
  var materialSelect = document.getElementById("material-filter");
  var sortSelect = document.getElementById("sort-select");
  var gridEl = document.getElementById("product-grid");
  var countEl = document.getElementById("result-count");

  function buildMaterialOptions(){
    var html = '<option value="all">すべての素材</option>';
    Object.keys(MATERIALS).forEach(function(k){
      html += '<option value="' + k + '">' + escapeHtml(MATERIALS[k].label) + '</option>';
    });
    materialSelect.innerHTML = html;
  }

  function subCategoriesForGroup(group){
    return Object.keys(CATEGORIES).filter(function(k){
      return group === "all" ? true : CATEGORIES[k].group === group;
    });
  }

  function renderSubChips(){
    var keys = subCategoriesForGroup(state.group);
    var html = '<button class="chip' + (state.category === "all" ? " active" : "") + '" data-cat="all">すべて</button>';
    keys.forEach(function(k){
      html += '<button class="chip' + (state.category === k ? " active" : "") + '" data-cat="' + k + '">' + escapeHtml(CATEGORIES[k].label) + '</button>';
    });
    subChipsEl.innerHTML = html;
    subChipsEl.querySelectorAll(".chip").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.category = btn.dataset.cat;
        renderSubChips();
        renderGrid();
      });
    });
  }

  groupTabs.forEach(function(btn){
    btn.addEventListener("click", function(){
      groupTabs.forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      state.group = btn.dataset.group;
      state.category = "all";
      renderSubChips();
      renderGrid();
    });
  });

  materialSelect.addEventListener("change", function(){
    state.material = materialSelect.value;
    renderGrid();
  });
  sortSelect.addEventListener("change", function(){
    state.sort = sortSelect.value;
    renderGrid();
  });

  function filteredProducts(){
    return products.filter(function(p){
      var cat = CATEGORIES[p.category];
      if(state.group !== "all" && cat.group !== state.group) return false;
      if(state.category !== "all" && p.category !== state.category) return false;
      if(state.material !== "all" && p.materials.indexOf(state.material) === -1) return false;
      return true;
    }).sort(function(a, b){
      switch(state.sort){
        case "price_asc": return a.price - b.price;
        case "price_desc": return b.price - a.price;
        case "name": return a.name.localeCompare(b.name, "ja");
        default: return 0;
      }
    });
  }

  function renderGrid(){
    var list = filteredProducts();
    countEl.textContent = list.length + "件表示中(全" + products.length + "件)";
    if(list.length === 0){
      gridEl.innerHTML = '<div class="empty">該当する商品がありません。絞り込み条件を変更してください。</div>';
      return;
    }
    gridEl.innerHTML = list.map(renderCard).join("");
    gridEl.querySelectorAll(".btn-inquiry").forEach(function(btn){
      btn.addEventListener("click", function(){
        alert("これはポートフォリオ用のサンプルページです。実際の運用では、ここにお問い合わせフォームやLINE連携ボタンなどを設置できます。");
      });
    });
    gridEl.querySelectorAll(".btn-browse").forEach(function(btn){
      btn.addEventListener("click", function(){
        var cat = btn.dataset.cat;
        state.group = CATEGORIES[cat].group;
        state.category = cat;
        groupTabs.forEach(function(b){ b.classList.toggle("active", b.dataset.group === state.group); });
        renderSubChips();
        renderGrid();
        gridEl.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
    gridEl.querySelectorAll(".photo.has-photo").forEach(function(photoEl){
      photoEl.addEventListener("click", function(){
        openLightbox(PHOTOS[photoEl.dataset.id]);
      });
    });
  }

  var lightboxEl = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightbox-img");

  function openLightbox(url){
    if(!url) return;
    lightboxImg.src = url;
    lightboxEl.classList.add("open");
  }
  function closeLightbox(){
    lightboxEl.classList.remove("open");
    lightboxImg.src = "";
  }
  document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
  lightboxEl.addEventListener("click", function(e){
    if(e.target === lightboxEl) closeLightbox();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeLightbox();
  });

  buildMaterialOptions();
  renderSubChips();
  renderGrid();

  // 更新ツール(別タブ・別ウィンドウ)で商品が保存されると、このタブのlocalStorageも書き換わる。
  // その変化を"storage"イベントで検知し、開いたままのカタログ画面を自動で再描画する。
  window.addEventListener("storage", function(e){
    if(e.key !== STORAGE_KEY) return;
    try{
      products = loadProducts().filter(function(p){ return p.published !== false; });
    }catch(err){
      return;
    }
    renderSubChips();
    renderGrid();
  });
})();
</script>
